<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Snake Game</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #fafafa; }
        canvas { background: #000; }
    </style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
let snake = [{ x: 160, y: 160 }];
let dx = grid;
let dy = 0;
let food = randomFood();
let count = 0;

function randomFood() {
    return {
        x: Math.floor(Math.random() * 20) * grid,
        y: Math.floor(Math.random() * 20) * grid
    };
}

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' && dx === 0) { dx = -grid; dy = 0; }
    else if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -grid; }
    else if (e.key === 'ArrowRight' && dx === 0) { dx = grid; dy = 0; }
    else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = grid; }
});

function loop() {
    requestAnimationFrame(loop);
    if (++count < 4) return;
    count = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    snake.unshift({ x: snake[0].x + dx, y: snake[0].y + dy });
    if (snake[0].x === food.x && snake[0].y === food.y) {
        food = randomFood();
    } else {
        snake.pop();
    }
    ctx.fillStyle = 'red';
    ctx.fillRect(food.x, food.y, grid - 1, grid - 1);
    ctx.fillStyle = 'lime';
    snake.forEach((cell, index) => {
        ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);
        if (index !== 0 && cell.x === snake[0].x && cell.y === snake[0].y ||
            snake[0].x < 0 || snake[0].x >= canvas.width ||
            snake[0].y < 0 || snake[0].y >= canvas.height) {
            snake = [{ x: 160, y: 160 }];
            dx = grid;
            dy = 0;
        }
    });
}

requestAnimationFrame(loop);
</script>
</body>
</html>
